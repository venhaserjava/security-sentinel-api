
# Desativa a criação automática de containers pelo Quarkus
quarkus.devservices.enabled=false
quarkus.datasource.devservices.enabled=false
quarkus.kafka.devservices.enabled=false

# Configurações do Banco de Dados (apontando para o seu Docker Compose)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=sentinel
quarkus.datasource.password=sentinel_password
quarkus.datasource.reactive.url=postgresql://localhost:5432/security_audit_db

# Como ainda não temos entidades @Entity, vamos silenciar o Hibernate por enquanto
quarkus.hibernate-orm.database.generation=none

