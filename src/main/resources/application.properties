# Configurações do Kafka Outgoing (Saída - Canal renomeado para security-audit-out)
mp.messaging.outgoing.security-audit-out.connector=smallrye-kafka
mp.messaging.outgoing.security-audit-out.topic=security-audit-topic
mp.messaging.outgoing.security-audit-out.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer

# Configuração do Consumidor (Incoming - Canal renomeado para security-audit-in)
mp.messaging.incoming.security-audit-in.connector=smallrye-kafka
mp.messaging.incoming.security-audit-in.topic=security-audit-topic
mp.messaging.incoming.security-audit-in.auto.offset.reset=earliest

# Estratégia de DLQ (Ajuste o prefixo para coincidir com o novo nome do canal de entrada)
mp.messaging.incoming.security-audit-in.failure-strategy=dead-letter-queue
mp.messaging.incoming.security-audit-in.dead-letter-queue.topic=security-audit-dead-letter

# Kafka Broker (Externo no Docker)
kafka.bootstrap.servers=localhost:9092

