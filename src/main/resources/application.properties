# --- DATABASE CONFIGURATION ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=sentinel
quarkus.datasource.password=sentinel_password
quarkus.datasource.reactive.url=postgresql://127.0.0.1:5432/security_audit_db

# Hibernate Reactive - Criação automática de tabelas
quarkus.hibernate-orm.database.generation=update
# Log de SQL para ajudar no debug do curso
quarkus.hibernate-orm.log.sql=true

# --- KAFKA INFRASTRUCTURE ---
quarkus.devservices.enabled=false
quarkus.kafka.devservices.enabled=false
kafka.bootstrap.servers=kafka:9092

# --- PRODUCER (security-audit-out) ---
mp.messaging.outgoing.security-audit-out.connector=smallrye-kafka
mp.messaging.outgoing.security-audit-out.topic=security-audit-topic
# Correção: Apontando para o pacote 'consumer' conforme sua estrutura atual
mp.messaging.outgoing.security-audit-out.value.serializer=br.com.venhaserjava.consumer.SecurityEventSerializer

# --- CONSUMER (security-audit-in) ---
mp.messaging.incoming.security-audit-in.connector=smallrye-kafka
mp.messaging.incoming.security-audit-in.topic=security-audit-topic
mp.messaging.incoming.security-audit-in.group.id=security-sentinel-v4

# Correção: Apontando para o pacote 'consumer'
mp.messaging.incoming.security-audit-in.value.deserializer=br.com.venhaserjava.consumer.SecurityEventDeserializer
mp.messaging.incoming.security-audit-in.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer

mp.messaging.incoming.security-audit-in.auto.offset.reset=earliest
mp.messaging.incoming.security-audit-in.session.timeout.ms=45000

# --- FAILURE STRATEGY & DLQ ---
mp.messaging.incoming.security-audit-in.failure-strategy=dead-letter-queue
mp.messaging.incoming.security-audit-in.dead-letter-queue.topic=security-audit-dead-letter
mp.messaging.incoming.security-audit-in.dead-letter-queue.key.serializer=org.apache.kafka.common.serialization.StringSerializer
# Correção: Usando seu Serializer para a DLQ
mp.messaging.incoming.security-audit-in.dead-letter-queue.value.serializer=br.com.venhaserjava.consumer.SecurityEventSerializer

# --- LOGGING & MONITORING ---
quarkus.log.level=INFO
quarkus.log.category."br.com.venhaserjava".level=DEBUG
quarkus.smallrye-health.enabled=true